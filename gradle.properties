# base information
projectType              = java-application
projectRootPackageName   = com.github.toolarium.db.changelog.cli
projectGroupId           = com.github.toolarium
projectComponentId       = toolarium
projectDescription       = A standalone command-line tool for managing database schema migrations and rollbacks. It provides commands like update, rollback, status, validate, tag, sync, dry-run, diff, history, and migrate, wrapping the toolarium-db-changelog library for use in CI/CD pipelines and terminal workflows.
projectUrl               = https://github.com/toolarium/toolarium-db-changelog-cli
licenseText              = MPL 2.0 License
licenseUrl               = https://raw.githubusercontent.com/toolarium/toolarium-db-changelog-cli/master/LICENSE

# tool information
# checkstyleToolVersion    = 13.4.0
# testDependencyVersion    = 5.12.2
sourceCompatibility      = 11
targetCompatibility      = 11

# jvm information
org.gradle.jvmargs       = -Xmx1g -XX:MaxHeapSize=1g -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.logging.level = quiet
org.gradle.console       = rich
org.gradle.warning.mode  = all

# build always docker image or environment pararameter CB_BUILD_ALWAYS_DOCKER_IMAGE
#buildAlwaysDockerImage  = true

# vulnerability scanner switch or environment pararameter CB_VULNERABILITY_SCANNER_ENABLED
#vulnerabilityScannerEnabled = true

# create fat jar which contains the content
#createFatJar             = true
